<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    a { color: #008069; } a:hover { color: #006e5b; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #EFEAE2; display: flex; flex-direction: column; overflow: hidden; color: #111B21; position: relative;">

  <!-- App bar -->
  <div style="background: #008069; padding: 18px 16px 20px; display: flex; align-items: center; gap: 14px;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    <div style="display:flex; flex-direction:column;">
      <span style="color: #FFFFFF; font-size: 17px; font-weight: 700;">Kòmand #0142</span>
      <span style="color: #B9F5E4; font-size: 12px;">Wideline Désir · 21 Out</span>
    </div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 18px 16px 130px; display: flex; flex-direction: column; gap: 16px;">

    <!-- Status tracker -->
    <div style="background:#FFFFFF; border-radius:18px; padding:20px 18px; box-shadow:0 2px 10px rgba(17,27,33,0.06);">
      <div style="display:flex; align-items:center;">
        <!-- step 1 done -->
        <div style="display:flex; flex-direction:column; align-items:center; gap:6px; width:70px;">
          <div style="width:34px; height:34px; border-radius:50%; background:#16B67C; display:flex; align-items:center; justify-content:center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </div>
          <span style="font-size:11px; font-weight:700; color:#16B67C; text-align:center;">Konfime</span>
        </div>
        <div style="flex:1; height:3px; border-radius:2px; margin-top:-16px; background:linear-gradient(90deg,#16B67C,#0E9E6B);"></div>
        <!-- step 2 done -->
        <div style="display:flex; flex-direction:column; align-items:center; gap:6px; width:70px;">
          <div style="width:34px; height:34px; border-radius:50%; background:#0E9E6B; display:flex; align-items:center; justify-content:center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </div>
          <span style="font-size:11px; font-weight:700; color:#0E9E6B; text-align:center;">Peye</span>
        </div>
        <div style="flex:1; height:3px; background:#E4E8EA; border-radius:2px; margin-top:-16px;"></div>
        <!-- step 3 current -->
        <div style="display:flex; flex-direction:column; align-items:center; gap:6px; width:70px;">
          <div style="width:34px; height:34px; border-radius:50%; background:#FFFFFF; border:3px solid #0A7D55; display:flex; align-items:center; justify-content:center;">
            <div style="width:10px; height:10px; border-radius:50%; background:#0A7D55;"></div>
          </div>
          <span style="font-size:11px; font-weight:700; color:#0A7D55; text-align:center;">Livre</span>
        </div>
      </div>
    </div>

    <!-- Items -->
    <div style="background:#FFFFFF; border-radius:16px; padding:6px 0; box-shadow:0 2px 10px rgba(17,27,33,0.05);">
      <div style="padding:12px 16px 8px; font-size:13px; font-weight:700; color:#667781;">Atik yo</div>
      <div style="display:flex; align-items:center; gap:12px; padding:11px 16px; border-top:1px solid #F2F4F5;">
        <div style="width:44px; height:44px; border-radius:10px; background:#FEF3E2; display:flex; align-items:center; justify-content:center; font-size:20px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B7791F" stroke-width="1.8"><ellipse cx="12" cy="13" rx="6" ry="8"/></svg>
        </div>
        <div style="flex:1; display:flex; flex-direction:column; gap:2px;">
          <span style="font-size:14px; font-weight:600;">Ze fre</span>
          <span style="font-size:12px; color:#8696A0;">3 douzèn × 180 HTG</span>
        </div>
        <span style="font-size:14px; font-weight:700;">540</span>
      </div>
      <div style="display:flex; align-items:center; gap:12px; padding:11px 16px; border-top:1px solid #F2F4F5;">
        <div style="width:44px; height:44px; border-radius:10px; background:#F1E9FA; display:flex; align-items:center; justify-content:center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A3EAF" stroke-width="1.8"><path d="M4 10a8 4 0 0 1 16 0v4a8 4 0 0 1-16 0z"/></svg>
        </div>
        <div style="flex:1; display:flex; flex-direction:column; gap:2px;">
          <span style="font-size:14px; font-weight:600;">Pen konplè</span>
          <span style="font-size:12px; color:#8696A0;">2 inite × 155 HTG</span>
        </div>
        <span style="font-size:14px; font-weight:700;">310</span>
      </div>
    </div>

    <!-- Payment -->
    <div style="background:#FFFFFF; border-radius:16px; padding:16px; box-shadow:0 2px 10px rgba(17,27,33,0.05); display:flex; flex-direction:column; gap:12px;">
      <div style="display:flex; justify-content:space-between; font-size:13px; color:#667781;"><span>Sou-total</span><span>850 HTG</span></div>
      <div style="display:flex; justify-content:space-between; font-size:13px; color:#667781;"><span>Livrezon (Delmas 31)</span><span>50 HTG</span></div>
      <div style="height:1px; background:#EEF1F2;"></div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:15px; font-weight:800;">Total</span>
        <span style="font-size:20px; font-weight:800;">900 HTG</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px; background:#E7F7F1; border-radius:10px; padding:10px 12px;">
        <div style="width:26px; height:26px; border-radius:6px; background:#D31E3C; display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:800;">M</div>
        <span style="font-size:12.5px; font-weight:600; color:#0B6B57;">Peye ak MonCash · Ref 8842</span>
        <div style="flex:1;"></div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#008069" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
    </div>

  </div>

  <!-- Sticky CTA -->
  <div style="position:absolute; bottom:0; left:0; right:0; background:#FFFFFF; border-top:1px solid #E9EDEF; padding:14px 16px 18px; display:flex; gap:12px;">
    <div style="width:52px; height:52px; border-radius:14px; background:#F0F2F3; display:flex; align-items:center; justify-content:center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#25D366" stroke="none"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1 0 12 2zm4.5 12.1c-.2-.1-1.4-.7-1.6-.8s-.4-.1-.5.1-.6.8-.8 1-.3.2-.5.1a6.5 6.5 0 0 1-1.9-1.2 7.2 7.2 0 0 1-1.3-1.7c-.1-.2 0-.4.1-.5l.4-.4.2-.4a.5.5 0 0 0 0-.5c0-.1-.5-1.3-.7-1.8s-.4-.4-.5-.4h-.5a.9.9 0 0 0-.7.3A2.8 2.8 0 0 0 7 8.4a4.9 4.9 0 0 0 1 2.6 11.2 11.2 0 0 0 4.3 3.8c.6.3 1.1.4 1.5.5a3.6 3.6 0 0 0 1.6.1c.5-.1 1.4-.6 1.6-1.1a2 2 0 0 0 .1-1.1c0-.1-.2-.2-.4-.3z"/></svg>
    </div>
    <div style="flex:1; height:52px; border-radius:14px; background:#25D366; box-shadow:0 4px 12px rgba(37,211,102,0.35); display:flex; align-items:center; justify-content:center; gap:8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      <span style="color:#fff; font-size:15px; font-weight:700;">Make kòm livre</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
