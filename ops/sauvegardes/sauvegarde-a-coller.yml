name: Sauvegarde CONVERZA

on:
  schedule:
    # 01h, 07h, 13h et 19h à Port-au-Prince (UTC-4).
    - cron: "0 5,11,17,23 * * *"
  workflow_dispatch:      # bouton « Run workflow » pour une sauvegarde à la demande

concurrency:
  group: sauvegarde
  cancel-in-progress: false

# Tout sauf le mot de passe. Ces valeurs ne sont pas des secrets : elles sont
# ici en clair pour qu'on puisse les lire et les corriger sans deviner.
#
# Une chaîne unique « postgresql://user:motdepasse@serveur/base » paraît plus
# simple, mais un mot de passe contenant @ : / # ou % la casse, et l'erreur
# renvoyée ne dit pas pourquoi. En séparant les paramètres, aucun caractère du
# mot de passe ne peut plus rien casser.
env:
  PGHOST: aws-0-us-west-2.pooler.supabase.com
  PGPORT: "5432"
  # Le compte en lecture seule créé par db/role-sauvegarde.sql, et non
  # « postgres » : si ce secret fuite, on copie les données sans pouvoir
  # les effacer. Le pooler attend le format <role>.<référence du projet>.
  PGUSER: sauvegarde.ftezqvnzaeoqlgqwjxst
  PGDATABASE: postgres

jobs:
  sauvegarder:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # pour commiter le dump dans ce dépôt privé
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les paramètres
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "${PGPASSWORD:-}" ]; then
            echo "Le secret SUPABASE_DB_PASSWORD n'est pas défini dans ce dépôt."
            echo "Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          echo "serveur      : $PGHOST"
          echo "port         : $PGPORT"
          echo "utilisateur  : $PGUSER"
          echo "base         : $PGDATABASE"
          echo "mot de passe : ${#PGPASSWORD} caractères"
          # Le mot de passe n'est jamais affiché. Sa longueur suffit à repérer
          # un collage tronqué ou des espaces accidentels.

      - name: Exporter la base
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dumps
          horodatage=$(date -u +%Y-%m-%d_%Hh%M)

          # pg_dump lancé depuis l'image PostgreSQL 17 : un client plus ancien
          # que le serveur refuse de s'exécuter, et la version du serveur
          # Supabase change sans prévenir.
          #
          # On exporte « public » (les données des marchands) ET « auth » (les
          # comptes et leurs mots de passe chiffrés). Sans « auth », une
          # restauration rendrait les données mais personne ne pourrait se
          # reconnecter.
          #
          # Les paramètres passent par l'environnement : le mot de passe
          # n'apparaît dans aucune ligne de commande.
          docker run --rm \
            -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGPASSWORD \
            postgres:17 \
            pg_dump --schema=public \
                    --table=auth.users --table=auth.identities \
                    --no-owner --no-privileges \
                    --quote-all-identifiers \
            | gzip -9 > "dumps/converza_${horodatage}.sql.gz"

          taille=$(stat -c%s "dumps/converza_${horodatage}.sql.gz")
          echo "Sauvegarde : dumps/converza_${horodatage}.sql.gz ($taille octets)"

          # Une sauvegarde vide est pire qu'aucune : elle rassure à tort.
          if [ "$taille" -lt 10000 ]; then
            echo "ÉCHEC : l'export fait moins de 10 Ko, la base n'a pas dû être lue."
            exit 1
          fi

      - name: Ne garder que les 60 dernières
        run: |
          cd dumps
          ls -1t converza_*.sql.gz | tail -n +61 | xargs -r rm -v
          echo "$(ls -1 converza_*.sql.gz | wc -l) sauvegardes conservées (environ 15 jours)"

      - name: Commiter
        run: |
          git config user.name  "Sauvegarde automatique"
          git config user.email "actions@github.com"
          git add dumps
          if git diff --cached --quiet; then
            echo "Rien de neuf."
          else
            git commit -m "sauvegarde $(date -u +%Y-%m-%d\ %Hh%M) UTC"
            git push
          fi
