# Sauvegarde automatique de la base CONVERZA.
#
# CE FICHIER NE VA PAS DANS CE DÉPÔT-CI : le dépôt CONVERZA est public, donc
# ses artefacts et ses journaux le sont aussi. Un export de base contient les
# noms, téléphones, clients et commandes des marchands. Il doit vivre dans un
# dépôt PRIVÉ, avec le secret qui va avec. Voir README.md à côté.
#
# Toutes les six heures : au pire, six heures de commandes perdues au lieu de
# vingt-quatre. Les dumps sont commités, donc l'historique Git devient la
# rétention : chaque sauvegarde reste consultable et comparable.

name: Sauvegarde CONVERZA

on:
  schedule:
    # 01h, 07h, 13h et 19h à Port-au-Prince (UTC-4).
    - cron: "0 5,11,17,23 * * *"
  workflow_dispatch:      # bouton « Run workflow » pour une sauvegarde à la demande

# Une seule sauvegarde à la fois : deux exécutions concurrentes se
# marcheraient dessus au moment du commit.
concurrency:
  group: sauvegarde
  cancel-in-progress: false

jobs:
  sauvegarder:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # pour commiter le dump dans ce dépôt privé
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la chaîne de connexion
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Décrit la FORME de la chaîne, jamais son contenu secret. Sans ça,
          # une chaîne mal formée ne produit qu'un « could not translate host
          # name » qui ne dit pas ce qui manque.
          if [ -z "${DB_URL:-}" ]; then
            echo "Le secret SUPABASE_DB_URL n'est pas défini dans ce dépôt."
            exit 1
          fi
          echo "longueur : ${#DB_URL} caractères"
          case "$DB_URL" in
            postgresql://*|postgres://*) ;;
            *) echo "PROBLÈME : la chaîne doit commencer par postgresql://" ; exit 1 ;;
          esac

          corps="${DB_URL#*://}"
          arobases=$(printf '%s' "$corps" | tr -cd '@' | wc -c)
          if [ "$arobases" -eq 0 ]; then
            echo "PROBLÈME : aucun « @ » dans la chaîne."
            echo "Il manque le mot de passe ET l'adresse du serveur."
            echo "Forme attendue :"
            echo "  postgresql://UTILISATEUR:MOTDEPASSE@SERVEUR:5432/postgres"
            echo "Recopiez la ligne entière depuis Supabase → Connect → Session pooler."
            exit 1
          fi

          avant="${corps%@*}"; apres="${corps##*@}"
          echo "utilisateur : ${avant%%:*}"
          echo "serveur     : ${apres%%:*}"
          echo "port/base   : ${apres#*:}"
          case "${avant}" in
            *:*) ;;
            *) echo "PROBLÈME : aucun mot de passe avant le @" ; exit 1 ;;
          esac
          case "${apres%%:*}" in
            *pooler.supabase.com) ;;
            db.*.supabase.co) echo "PROBLÈME : c'est « Direct connection » (IPv6, injoignable ici). Prenez « Session pooler »." ; exit 1 ;;
            *) echo "PROBLÈME : le serveur devrait finir par pooler.supabase.com" ; exit 1 ;;
          esac
          case "${apres#*:}" in
            6543/*) echo "PROBLÈME : port 6543 = Transaction pooler, incompatible avec pg_dump. Prenez le port 5432." ; exit 1 ;;
            5432/*) ;;
            *) echo "PROBLÈME : port ou base inattendus (attendu 5432/postgres)" ; exit 1 ;;
          esac
          echo "La forme est correcte."

      - name: Exporter la base
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p dumps
          horodatage=$(date -u +%Y-%m-%d_%Hh%M)

          # pg_dump lancé depuis l'image PostgreSQL 17 : un client plus ancien
          # que le serveur refuse de s'exécuter, et la version du serveur
          # Supabase change sans prévenir. Le client 17 accepte les serveurs 15
          # à 17.
          #
          # On exporte « public » (les données des marchands) ET « auth » (les
          # comptes et leurs mots de passe chiffrés). Sans « auth », une
          # restauration rendrait les données mais personne ne pourrait se
          # reconnecter.
          # Les guillemets SIMPLES autour du sh -c sont délibérés : sans eux, le
          # shell du serveur remplacerait $DB_URL avant de lancer Docker, et le
          # mot de passe apparaîtrait dans la ligne de commande, visible par tout
          # processus de la machine. Ici il n'est lu qu'à l'intérieur du conteneur,
          # qui disparaît aussitôt.
          docker run --rm -e DB_URL postgres:17 \
            sh -c 'pg_dump "$DB_URL" \
                     --schema=public --schema=auth \
                     --no-owner --no-privileges \
                     --quote-all-identifiers' \
            | gzip -9 > "dumps/converza_${horodatage}.sql.gz"

          taille=$(stat -c%s "dumps/converza_${horodatage}.sql.gz")
          echo "Sauvegarde : dumps/converza_${horodatage}.sql.gz ($taille octets)"

          # Une sauvegarde vide est pire qu'aucune : elle rassure à tort.
          if [ "$taille" -lt 10000 ]; then
            echo "ÉCHEC : l'export fait moins de 10 Ko, la base n'a pas dû être lue."
            exit 1
          fi

      - name: Ne garder que les 60 dernières
        run: |
          cd dumps
          ls -1t converza_*.sql.gz | tail -n +61 | xargs -r rm -v
          echo "$(ls -1 converza_*.sql.gz | wc -l) sauvegardes conservées (environ 15 jours)"

      - name: Commiter
        run: |
          git config user.name  "Sauvegarde automatique"
          git config user.email "actions@github.com"
          git add dumps
          if git diff --cached --quiet; then
            echo "Rien de neuf."
          else
            git commit -m "sauvegarde $(date -u +%Y-%m-%d\ %Hh%M) UTC"
            git push
          fi
